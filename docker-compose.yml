# Local stack: MariaDB, Redis, phpMyAdmin and the API.
#
#   docker compose up -d mysql redis          # databases only (run the API with npm run dev on your machine)
#   docker compose up -d --build              # everything, including the API on port 5000
#   docker compose run --rm api npm run migrate
#   docker compose run --rm api npm run seed
#   docker compose run --rm api npm run auth  # creates the super admin from SUPER_ADMIN_* in .env
#
# Values come from .env (copy .env.example). Inside the network the database host is "mysql" and Redis is "redis"; the
# api service overrides those two, so .env can keep localhost for running the API on your machine.
services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${CENTRAL_MYSQL_DB:-app_db}
      MARIADB_USER: ${CENTRAL_MYSQL_USER:-app}
      MARIADB_PASSWORD: ${CENTRAL_MYSQL_PASSWORD:-app}
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=64M"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV_DOCKER:-development}
      CENTRAL_MYSQL_HOST: mysql
      CENTRAL_MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  storage:
