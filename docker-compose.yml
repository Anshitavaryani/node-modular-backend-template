# Local stack: MariaDB, Redis, phpMyAdmin and the API.
#
#   docker compose up -d mysql redis          # databases only (run the API with npm run dev on your machine)
#   docker compose up -d --build              # everything, including the API on port 5000
#   docker compose run --rm api npm run migrate
#   docker compose run --rm api npm run seed
#   docker compose run --rm api npm run auth  # creates the super admin from SUPER_ADMIN_* in .env
#
# Values come from .env (copy .env.example). Inside the network the database host is "mysql" and Redis is "redis"; the
# api service overrides those two, so .env can keep localhost for running the API on your machine.
# Host ports come from .env too: CENTRAL_MYSQL_PORT, REDIS_PORT, PMA_PORT and PORT (defaults 3306, 6379, 8080, 5000).
# Change them when another stack already uses those ports; the API on your machine reads the same values.
services:
  mysql:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${CENTRAL_MYSQL_DB:-app_db}
      MARIADB_USER: ${CENTRAL_MYSQL_USER:-app}
      MARIADB_PASSWORD: ${CENTRAL_MYSQL_PASSWORD:-app}
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=64M"]
    ports:
      - "${CENTRAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs once on an empty volume: lets the app user create the *_test databases that npm test builds.
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV_DOCKER:-development}
      # The app listens on 5000 inside the container whatever PORT is in .env; PORT is the host side of the mapping.
      PORT: 5000
      CENTRAL_MYSQL_HOST: mysql
      CENTRAL_MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  storage:
